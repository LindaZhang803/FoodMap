name: Feed CI

on:
  push:
    branches: [szang005, szang005-test]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-feed:
    name: Backend — Feed, Favorites & Real Owner Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            backend/modules/feed/package-lock.json

      - name: Cache MongoDB Memory Server binary (7.0.24)
        uses: actions/cache@v4
        with:
          path: /tmp/foodmap-member4-mongodb
          key: ${{ runner.os }}-mongodb-memory-server-7.0.24

      # Shared manifests remain owned by the host. Keep both locked installs
      # explicit until its owner supplies the canonical feed test dependency.
      - name: Install existing shared backend dependencies
        run: npm ci

      - name: Install Member 4 test dependencies
        run: npm ci --prefix modules/feed

      - name: Run shared Jest suites without Node-runner discovery
        run: npm test

      - name: Run unit & Express route contract tests
        run: npm --prefix modules/feed run test:unit

      - name: Run disposable MongoDB integration tests
        run: npm --prefix modules/feed run test:mongo

      - name: Verify real Accounts, Restaurant and Dish integration
        run: npm --prefix modules/feed run test:host

  mobile-feed:
    name: Mobile — Feed, Favorites & Wheel (Jest + Expo Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile/src/modules/feed
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache local pnpm store (.pnpm-store)
        uses: actions/cache@v4
        with:
          path: Mobile/src/modules/feed/.pnpm-store
          key: ${{ runner.os }}-pnpm-feed-${{ hashFiles('Mobile/src/modules/feed/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-feed-

      # Real reader sources live outside feed and resolve their runtime from
      # the shared app installation. Root manifest consolidation is owner work.
      - name: Install existing shared reader dependencies
        working-directory: Mobile
        run: npm ci

      - name: Install Member 4 dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest test suites
        run: pnpm test --ci

      - name: Verify My Feed toolbar and shared sign-in navigation
        run: pnpm test --config jest.host.config.cjs --ci

      - name: Verify Expo Web bundle export
        run: pnpm run export:web

  mobile-host-build:
    name: Mobile — App with My Feed (Web + iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Install existing shared app dependencies
        run: npm ci

      - name: Install Member 4 runtime dependencies
        working-directory: Mobile/src/modules/feed
        run: pnpm install --frozen-lockfile

      - name: Verify app web export
        run: npx --no-install expo export --platform web --output-dir /tmp/foodmap-app-web

      - name: Verify app iOS export
        run: npx --no-install expo export --platform ios --output-dir /tmp/foodmap-app-ios
